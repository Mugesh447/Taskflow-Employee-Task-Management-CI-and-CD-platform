name: TaskFlow AWS CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt coverage
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run tests with coverage
        run: coverage run -m unittest discover -s tests -v && coverage report -m && coverage xml
      - name: Validate Terraform formatting and configuration
        if: github.event_name == 'pull_request'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform checks
        if: github.event_name == 'pull_request'
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-coverage
          path: coverage.xml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate AWS deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
          TASKFLOW_PUBLIC_URL: ${{ vars.TASKFLOW_PUBLIC_URL }}
        run: |
          missing=0
          for name in AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY ECS_CLUSTER_NAME ECS_SERVICE_NAME TASKFLOW_PUBLIC_URL; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions variable: $name" >&2
              missing=1
            fi
          done
          exit "$missing"
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - name: Capture currently running task definition
        id: previous-task
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
        run: |
          TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME" \
            --query 'services[0].taskDefinition' \
            --output text)
          if [ -z "$TASK_DEFINITION" ] || [ "$TASK_DEFINITION" = "None" ]; then
            echo "Could not determine the currently deployed task definition." >&2
            exit 1
          fi
          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"
      - name: Read current ECS task definition
        env:
          PREVIOUS_TASK_DEFINITION: ${{ steps.previous-task.outputs.task_definition }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$PREVIOUS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json
      - name: Set the image in the task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: taskflow
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
      - name: Deploy the new task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true
      - name: Ensure the service is running
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --desired-count 2
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"
      - name: Verify the public application health endpoint
        env:
          TASKFLOW_PUBLIC_URL: ${{ vars.TASKFLOW_PUBLIC_URL }}
        run: |
          if [ -z "$TASKFLOW_PUBLIC_URL" ]; then
            echo "Set the TASKFLOW_PUBLIC_URL repository variable to the deployed HTTPS origin." >&2
            exit 1
          fi
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 \
              "${TASKFLOW_PUBLIC_URL%/}/api/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "TaskFlow did not pass its database-backed public health check." >&2
          exit 1
      - name: Roll back to the previously running task definition
        if: failure() && steps.previous-task.outputs.task_definition != ''
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
          PREVIOUS_TASK_DEFINITION: ${{ steps.previous-task.outputs.task_definition }}
        run: |
          echo "Deployment verification failed; restoring $PREVIOUS_TASK_DEFINITION."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --task-definition "$PREVIOUS_TASK_DEFINITION"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME"
