services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow_backend
    ports:
      - "5001:5000"
    environment:
      TASKFLOW_SECRET_KEY: ${TASKFLOW_SECRET_KEY:-local-development-only-change-me}
      TASKFLOW_DATABASE_URI: ${TASKFLOW_DATABASE_URI:-sqlite:////app/instance/taskflow.db}
    volumes:
      - taskflow_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    profiles: [production]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: [production]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  taskflow_data:
  postgres_data:
  redis_data:
