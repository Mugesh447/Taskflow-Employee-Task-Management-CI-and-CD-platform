apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secret
type: Opaque
stringData:
  secret-key: replace-with-a-long-random-production-secret
  # Configure both values to enable password recovery email.
  smtp-user: replace-with-an-smtp-username
  smtp-password: replace-with-an-smtp-app-password
  database-uri: postgresql+psycopg://taskflow:replace-password@taskflow-postgres:5432/taskflow
  # Set this only when Jenkins is protected by basic authentication.
  # jenkins-url: https://jenkins.example.com
  # jenkins-user: deployer
  # jenkins-token: replace-with-a-jenkins-api-token
