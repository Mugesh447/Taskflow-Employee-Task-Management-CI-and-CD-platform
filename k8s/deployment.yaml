apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      containers:
        - name: taskflow
          image: taskflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: taskflow-config
          env:
            - name: TASKFLOW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: secret-key
            - name: TASKFLOW_DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: database-uri
            - name: TASKFLOW_START_REMINDER_SCHEDULER
              value: "true"
            - name: TASKFLOW_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: smtp-user
                  optional: true
            - name: TASKFLOW_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secret
                  key: smtp-password
                  optional: true
          volumeMounts:
            - name: taskflow-data
              mountPath: /app/instance
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: taskflow-data
          persistentVolumeClaim:
            claimName: taskflow-data
